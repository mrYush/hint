# goreleaser builds the release binaries and publishes them when a v* tag
# is pushed (see .github/workflows/release.yml). `goreleaser check`
# validates this file; `goreleaser release --snapshot --clean` builds
# everything locally into dist/ without publishing.
version: 2

project_name: hint

before:
  hooks:
    - go mod verify

builds:
  - id: hint
    main: ./cmd/hint
    binary: hint
    # The core must stay cgo-free so that every target cross-compiles from
    # one Linux runner (docs/plan/risks.md, R1).
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .CommitDate }}
    # Reproducible: the binary's timestamp is the commit's, not the build's.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats:
      - tar.gz
    # hint_0.1.0_linux_arm64.tar.gz; the Pi and Homebrew both key on this.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

nfpms:
  - id: hint
    package_name: hint
    ids:
      - hint
    formats:
      - deb
    # hint_0.2.0_linux_amd64.deb; scripts/apt-repo.sh indexes dist/*.deb.
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    maintainer: Yurii Simonov <rep.yurii@gmail.com>
    homepage: https://github.com/mrYush/hint
    description: Context-aware CLI assistant that reads, edits and runs your project
    license: MIT
    section: utils
    priority: optional
    bindir: /usr/bin
    # Same reasoning as the cask: grep and glob use ripgrep when present and
    # fall back to a pure-Go walk, so it is recommended-by-default, not a
    # hard requirement of the binary. The plan (WP0.14) asks for a
    # dependency so the fast path is what apt users get.
    dependencies:
      - ripgrep

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"

release:
  github:
    owner: mrYush
    name: hint
  # v0.2.0-alpha and friends are GitHub pre-releases; a plain vX.Y.Z is final.
  prerelease: auto
  name_template: "{{ .Tag }}"
  # A failed index push (cask, scoop) leaves the GitHub Release in place;
  # re-running the workflow on the same tag must then be able to upload
  # the same archives again instead of failing on the existing assets.
  replace_existing_artifacts: true
  footer: |
    Known issues for this release are listed in the README under
    *Troubleshooting → Known issues*; the open bugs are tracked as
    `[Phase 0]` GitHub issues. The limits of this release (no sandbox
    for `bash`, completion off by default, the secret store verified on
    Linux only) are in that same section.

# Homebrew tap: the cask is pushed to mrYush/homebrew-tap, so that
# `brew install --cask mrYush/tap/hint` works. goreleaser is retiring the
# formula-based `brews` block in favour of casks, which is what a prebuilt
# binary is anyway. The push needs a token with write access to that
# repository in the HOMEBREW_TAP_TOKEN secret; the workflow's own
# GITHUB_TOKEN cannot write to another repository.
homebrew_casks:
  - name: hint
    repository:
      owner: mrYush
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/mrYush/hint
    description: Context-aware CLI assistant that reads, edits and runs your project
    license: MIT
    binaries: [hint]
    # grep and glob prefer ripgrep and fall back to a pure-Go walk without
    # it; the cask pulls it in so the fast path is the one users get.
    dependencies:
      - formula: ripgrep
    # The binaries are not signed or notarized: macOS quarantines them on
    # download and would refuse to run them. The steps lift the flag in
    # Homebrew's declarative hook DSL (`postflight_steps`); the Ruby
    # `install` block is deprecated since goreleaser v2.19.
    hooks:
      post:
        install_steps: |
          on_macos do
            if_path_exists "/usr/bin/xattr" do
              run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/hint"]
            end
          end
    # Pre-releases are not offered to brew users; the cask follows final
    # versions only.
    skip_upload: auto
    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"

# Scoop bucket: the manifest is pushed to mrYush/scoop-bucket, so that
# `scoop bucket add hint https://github.com/mrYush/scoop-bucket` and
# `scoop install hint` work on Windows amd64 and arm64 (goreleaser keys
# the windows .zip archives as "64bit" and "arm64"). The push needs a
# token with write access to that repository in the SCOOP_BUCKET_TOKEN
# secret, for the same reason as the cask.
scoops:
  - name: hint
    repository:
      owner: mrYush
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    # The bucket root, as goreleaser recommends; Scoop reads manifests
    # from the root or from a bucket/ subdirectory.
    directory: ""
    homepage: https://github.com/mrYush/hint
    description: Context-aware CLI assistant that reads, edits and runs your project
    license: MIT
    # Same as the cask and the deb: ripgrep is in Scoop's main bucket,
    # which every Scoop install has.
    depends:
      - ripgrep
    # Pre-releases stay off the bucket, like the cask.
    skip_upload: auto
    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
