[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hint-harbor"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = ["harbor==0.25.0", "pydantic==2.14.3", "pyyaml==6.0.3", "typing-extensions==4.16.0"]

[project.optional-dependencies]
dev = ["pyright==1.1.403", "ruff==0.11.13", "types-PyYAML==6.0.12.20250516"]
docs = ["sphinx==8.2.3"]

[tool.setuptools.packages.find]
include = ["hint_harbor*"]


[tool.setuptools.package-data]
hint_harbor = ["py.typed"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ANN", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pyright]
include = ["hint_harbor", "benchmark.py", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
