# Release: pushing an annotated v* tag (CONTRIBUTING.md, "Releases")
# builds every target with goreleaser, attaches the archives and
# checksums and .deb packages to a GitHub Release, and — for a final
# version — updates the Homebrew cask in mrYush/homebrew-tap and rebuilds
# the apt repository on the gh-pages branch (served by GitHub Pages).
#
# Secrets: GITHUB_TOKEN is provided by GitHub; HOMEBREW_TAP_TOKEN must be
# a token with write access to mrYush/homebrew-tap. Without it the brew
# step fails on a final release (pre-releases skip it).
# APT_SIGNING_KEY is the ASCII-armored private key that signs the apt
# Release file (APT_SIGNING_PASSPHRASE if it has one). Without it the apt
# step fails on a final release, after the GitHub Release is published.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog is built from the git history since the last tag.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test before publishing
        run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Two tags on one commit make GoReleaser pick whichever git lists
          # first (v0.2.0 was built as v0.2.0-alpha). The ref that triggered
          # the run is the tag we mean to publish.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # Final versions only, like the cask: a tag with a suffix such as
      # -alpha is a pre-release and stays off every index. The repository is
      # rebuilt from this release's debs alone and pushed as a single orphan
      # commit, so gh-pages never accumulates old binaries.
      - name: Publish apt repository
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/apt-repo.sh dist "$RUNNER_TEMP/apt-site"
          cd "$RUNNER_TEMP/apt-site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "apt repository for ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
