# Release: pushing an annotated v* tag (CONTRIBUTING.md, "Releases")
# builds every target with goreleaser, attaches the archives and
# checksums to a GitHub Release, and — for a final version — updates the
# Homebrew formula in mrYush/homebrew-hint.
#
# Secrets: GITHUB_TOKEN is provided by GitHub; HOMEBREW_TAP_TOKEN must be
# a token with write access to mrYush/homebrew-hint. Without it the brew
# step fails on a final release (pre-releases skip it).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog is built from the git history since the last tag.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test before publishing
        run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
