# The pull-request gate: lint, test (with the race detector) and a
# cross-compilation matrix of every release target. Tests run on Linux
# only; the other targets are checked by building them, and by the
# Raspberry Pi acceptance run before a release.
name: CI

on:
  push:
    branches: [main, develop, release/v0.4.0]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch supersedes the running jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - uses: golangci/golangci-lint-action@v8
        with:
          # The one place the lint version is pinned (CONTRIBUTING points here).
          # It must be built with a Go at least as new as go.mod's; .golangci.yml
          # is a v2 config.
          version: v2.13.2

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ripgrep
        # grep and glob take the ripgrep path when it is installed and the
        # pure-Go path otherwise; CI exercises the former, the fallback has
        # its own tests.
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o build/ ./cmd/hint
      - run: go vet ./...

  harbor:
    name: Harbor adapter
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/harbor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
      - run: python -m pip install -r requirements.txt '.[dev,docs]'
      - run: python -m unittest discover -s tests -v
      - run: ruff format --check .
      - run: ruff check .
      - run: pyright
      - run: sphinx-build -W -b html docs docs/_build
